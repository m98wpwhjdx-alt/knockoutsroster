<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Anaesthesia Workspace</title>
  <style>
    :root {
      --bg: #030406;
      --text: #f8fafc;
      --muted: #b8c2d6;
      --line: rgba(255,255,255,.18);
      --panel: rgba(8, 13, 20, .62);
      --panel2: rgba(255,255,255,.08);
      --cyan: #39d7ff;
      --green: #64f4ac;
      --amber: #ffd166;
      --shadow: 0 24px 90px rgba(0,0,0,.58);
    }

    * { box-sizing: border-box; }

    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background:
        linear-gradient(90deg, rgba(0,0,0,.76), rgba(0,0,0,.28) 46%, rgba(0,0,0,.72)),
        linear-gradient(180deg, rgba(0,0,0,.24), rgba(0,0,0,.88)),
        url("anaesthesia.jpg") center center / cover no-repeat fixed;
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(circle at 18% 18%, rgba(57,215,255,.18), transparent 32%),
        radial-gradient(circle at 82% 72%, rgba(100,244,172,.10), transparent 34%);
      z-index: -1;
    }

    .shell {
      width: min(1120px, calc(100% - 32px));
      min-height: 100vh;
      margin: 0 auto;
      display: grid;
      align-content: center;
      padding: 44px 0;
    }

    .hero {
      max-width: 780px;
      padding: 28px;
      border: 1px solid var(--line);
      border-radius: 34px;
      background: linear-gradient(145deg, rgba(255,255,255,.12), rgba(255,255,255,.045));
      box-shadow: var(--shadow);
      backdrop-filter: blur(18px);
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      margin-bottom: 18px;
      padding: 8px 12px;
      border: 1px solid rgba(57,215,255,.38);
      border-radius: 999px;
      background: rgba(57,215,255,.12);
      color: #c8f6ff;
      font-weight: 800;
      font-size: 13px;
      letter-spacing: .02em;
    }


    .beta-logo {
      position: relative;
      z-index: 1;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-right: 10px;
      padding: 4px 8px;
      border: 1px solid rgba(255,209,102,.58);
      border-radius: 999px;
      background: linear-gradient(135deg, rgba(255,209,102,.28), rgba(255,255,255,.08));
      color: #ffe7a3;
      font-size: .38em;
      font-weight: 950;
      letter-spacing: .08em;
      vertical-align: middle;
      box-shadow: 0 0 24px rgba(255,209,102,.16);
    }

    h1 {
      margin: 0;
      font-size: clamp(38px, 7vw, 82px);
      line-height: .92;
      letter-spacing: -.065em;
      text-wrap: balance;
    }

    .subtitle {
      max-width: 650px;
      margin: 18px 0 0;
      color: var(--muted);
      font-size: clamp(15px, 2.2vw, 18px);
      line-height: 1.65;
    }

    .tabs {
      width: min(780px, 100%);
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 18px;
      margin: 0 auto;
    }

    .tab {
      position: relative;
      min-height: 190px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 22px;
      color: var(--text);
      text-decoration: none;
      border: 1px solid var(--line);
      border-radius: 30px;
      background: linear-gradient(150deg, rgba(255,255,255,.14), rgba(255,255,255,.045));
      box-shadow: 0 20px 60px rgba(0,0,0,.36);
      backdrop-filter: blur(18px);
      overflow: hidden;
      transition: transform .22s ease, border-color .22s ease, background .22s ease;
    }

    .tab::after {
      content: "";
      position: absolute;
      right: -44px;
      top: -44px;
      width: 140px;
      height: 140px;
      border-radius: 999px;
      background: var(--glow, rgba(57,215,255,.24));
      filter: blur(2px);
      opacity: .6;
    }

    .tab:hover,
    .tab:focus-visible {
      transform: translateY(-5px);
      border-color: rgba(57,215,255,.62);
      background: linear-gradient(150deg, rgba(255,255,255,.18), rgba(255,255,255,.065));
      outline: none;
    }

    .tab .icon {
      width: 54px;
      height: 54px;
      display: grid;
      place-items: center;
      border: 1px solid rgba(255,255,255,.18);
      border-radius: 20px;
      background: rgba(0,0,0,.28);
      font-size: 27px;
      z-index: 1;
    }

    .tab h2 {
      position: relative;
      z-index: 1;
      margin: 22px 0 8px;
      font-size: clamp(23px, 3vw, 34px);
      line-height: 1;
      letter-spacing: -.04em;
    }

    .tab p {
      position: relative;
      z-index: 1;
      margin: 0;
      color: var(--muted);
      line-height: 1.55;
      font-size: 14px;
    }

    .open {
      position: relative;
      z-index: 1;
      margin-top: 18px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-weight: 900;
      color: #e8fbff;
    }

    .footer {
      margin-top: 22px;
      padding: 14px 18px;
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 20px;
      background: rgba(0,0,0,.28);
      color: rgba(248,250,252,.76);
      font-size: 13px;
      line-height: 1.5;
      backdrop-filter: blur(12px);
    }

    @media (max-width: 720px) {
      body { background-attachment: scroll; }
      .shell { width: min(100% - 22px, 1120px); padding: 24px 0; }
      .hero { padding: 20px; border-radius: 26px; }
      .tabs { grid-template-columns: 1fr; gap: 14px; }
      .tab { min-height: 168px; border-radius: 24px; padding: 18px; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <nav class="tabs" aria-label="Main app links">
      <a class="tab" href="Roster.html" style="--glow: rgba(57,215,255,.24)">
        <div>
          <div class="icon">📋</div>
          <h2>Roster</h2>
          <p>Open the duty roster and workload dashboard.</p>
        </div>
        <span class="open">Open roster →</span>
      </a>

      <a class="tab" href="Anaesthesia%20companion.html" style="--glow: rgba(100,244,172,.20)">
        <div>
          <div class="icon">✚</div>
          <h2><span class="beta-logo" aria-label="Beta">BETA</span>Anaesthesia Companion</h2>
          <p>Open the anaesthesia monitoring, record, dosing and companion app.</p>
        </div>
        <span class="open">Open companion →</span>
      </a>

      <a class="tab" href="IntraopFluidSimulator.html" style="--glow: rgba(255,209,102,.22)">
        <div>
          <div class="icon">💧</div>
          <h2><span class="beta-logo" aria-label="Beta">BETA</span>Intraop Fluid Simulator</h2>
          <p>Open the intraoperative fluid planning and simulation tool.</p>
        </div>
        <span class="open">Open simulator →</span>
      </a>
    </nav>

  </main>
</body>
</html>
