<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Anaesthesia Workspace</title>
  <style>
    :root {
      --text: #f8fafc;
      --muted: #afbdd0;
      --soft: rgba(255, 255, 255, .10);
      --softer: rgba(255, 255, 255, .055);
      --line: rgba(255, 255, 255, .16);
      --cyan: #38d6ff;
      --violet: #9b8cff;
      --green: #65f5b0;
      --amber: #ffd166;
      --rose: #ff7ab6;
      --shadow: 0 28px 90px rgba(0,0,0,.56);
    }

    * { box-sizing: border-box; }

    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      min-height: 100svh;
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background:
        linear-gradient(130deg, rgba(4,9,24,.86), rgba(18,24,50,.50) 46%, rgba(2,6,23,.90)),
        radial-gradient(circle at 20% 16%, rgba(56,214,255,.34), transparent 28%),
        radial-gradient(circle at 82% 22%, rgba(255,122,182,.30), transparent 30%),
        radial-gradient(circle at 58% 84%, rgba(101,245,176,.18), transparent 30%),
        url("anaesthesia.jpg") center center / cover no-repeat fixed;
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background-image:
        linear-gradient(rgba(255,255,255,.045) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.045) 1px, transparent 1px);
      background-size: 46px 46px;
      mask-image: linear-gradient(to bottom, rgba(0,0,0,.72), transparent 82%);
      z-index: -1;
    }

    .shell {
      width: min(760px, calc(100% - 72px));
      min-height: 100svh;
      margin: 0 auto;
      padding: 34px 0;
      display: grid;
      align-content: center;
      gap: 0;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 12px 14px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: linear-gradient(135deg, rgba(255,255,255,.12), rgba(255,255,255,.045));
      box-shadow: 0 16px 50px rgba(0,0,0,.28);
      backdrop-filter: blur(18px);
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-size: 14px;
      font-weight: 900;
      letter-spacing: .02em;
    }

    .brand-mark {
      width: 34px;
      height: 34px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: linear-gradient(135deg, rgba(56,214,255,.95), rgba(101,245,176,.88));
      color: #02111b;
      box-shadow: 0 0 32px rgba(56,214,255,.28);
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      padding: 8px 12px;
      border: 1px solid rgba(101,245,176,.28);
      border-radius: 999px;
      color: #d9ffee;
      background: rgba(101,245,176,.09);
      font-size: 12px;
      font-weight: 850;
    }

    .pulse {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 0 7px rgba(101,245,176,.12);
    }

    .tabs {
      display: grid;
      grid-template-columns: 1fr;
      gap: 18px;
    }

    .tab {
      position: relative;
      min-height: 92px;
      display: grid;
      grid-template-columns: 112px minmax(0, 1fr);
      align-items: center;
      gap: 18px;
      padding: 16px 22px;
      color: var(--text);
      text-decoration: none;
      border: 1px solid rgba(255,255,255,.34);
      border-radius: 28px;
      background:
        linear-gradient(145deg, rgba(255,255,255,.28), rgba(255,255,255,.06) 58%, rgba(255,255,255,.14)),
        radial-gradient(circle at 78% 18%, var(--glow), transparent 42%);
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.50),
        inset 0 -24px 60px rgba(255,255,255,.055),
        0 22px 62px rgba(0,0,0,.36),
        0 0 0 1px rgba(255,255,255,.06),
        0 0 42px 6px var(--glow);
      backdrop-filter: blur(28px) saturate(170%);
      -webkit-backdrop-filter: blur(28px) saturate(170%);
      overflow: hidden;
      isolation: isolate;
      transition: transform .24s ease, border-color .24s ease, background .24s ease, box-shadow .24s ease;
    }

    .tab::before {
      content: "";
      position: absolute;
      inset: 1px;
      border-radius: 27px;
      background:
        linear-gradient(120deg, rgba(255,255,255,.42), transparent 28%),
        linear-gradient(315deg, rgba(255,255,255,.18), transparent 42%);
      opacity: .78;
      z-index: -1;
    }

    .tab::after {
      content: "";
      position: absolute;
      left: -18%;
      right: -18%;
      top: 38%;
      height: 34px;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,.30), transparent);
      filter: blur(12px);
      transform: rotate(-13deg);
      opacity: .55;
      pointer-events: none;
    }

    .tab h2 {
      margin: 0;
      font-size: clamp(18px, 2.2vw, 24px);
      line-height: 1.1;
      letter-spacing: 0;
    }

    .tab:hover,
    .tab:focus-visible {
      transform: translateY(-7px) scale(1.01);
      border-color: rgba(255,255,255,.62);
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.58),
        0 30px 82px rgba(0,0,0,.52),
        0 0 0 1px rgba(255,255,255,.10),
        0 0 64px 12px var(--glow);
      outline: none;
    }

    .meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .number {
      width: 40px;
      height: 40px;
      display: grid;
      place-items: center;
      border: 1px solid rgba(255,255,255,.18);
      border-radius: 16px;
      background: rgba(2,6,23,.34);
      color: #ecfeff;
      font-weight: 950;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.12);
    }

    .icon {
      width: 48px;
      height: 48px;
      display: grid;
      place-items: center;
      border-radius: 20px;
      background: rgba(255,255,255,.16);
      border: 1px solid rgba(255,255,255,.26);
      font-size: 25px;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.22);
    }

    .beta-logo {
      position: absolute;
      right: 18px;
      top: 12px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin: 0;
      width: fit-content;
      padding: 5px 9px;
      border: 1px solid rgba(255,209,102,.48);
      border-radius: 999px;
      background: linear-gradient(135deg, rgba(255,209,102,.22), rgba(255,255,255,.07));
      color: #ffe7a3;
      font-size: 11px;
      font-weight: 950;
      letter-spacing: .09em;
      box-shadow: 0 0 26px rgba(255,209,102,.13);
    }

    @media (max-width: 980px) {
      .shell {
        width: min(720px, calc(100% - 54px));
      }
    }

    @media (max-width: 620px) {
      body {
        min-height: 100svh;
        background-attachment: scroll;
      }

      body::before {
        background-size: 34px 34px;
        opacity: .58;
      }

      .shell {
        width: min(100% - 44px, 420px);
        min-height: 100svh;
        padding: 16px 0;
        align-content: center;
        gap: 0;
      }

      .topbar { border-radius: 24px; align-items: flex-start; flex-direction: column; }

      .tabs {
        grid-template-columns: 1fr;
        gap: 14px;
      }

      .tab {
        min-height: 78px;
        display: grid;
        grid-template-columns: 86px minmax(0, 1fr);
        align-items: center;
        gap: 10px;
        border-radius: 20px;
        padding: 10px 12px;
      }

      .tab::before { border-radius: 19px; }

      .tab::after {
        top: 32%;
        height: 22px;
      }

      .meta {
        justify-content: flex-start;
        gap: 8px;
      }

      .number {
        width: 34px;
        height: 34px;
        border-radius: 13px;
        font-size: 13px;
      }

      .icon {
        width: 38px;
        height: 38px;
        border-radius: 15px;
        font-size: 20px;
      }

      .tab h2 {
        margin: 0;
        font-size: 14px;
        line-height: 1.12;
      }

      .beta-logo {
        position: absolute;
        right: 12px;
        top: 7px;
        margin: 0;
        padding: 3px 7px;
        font-size: 9px;
      }

    }
  </style>
</head>
<body>
  <main class="shell">
    <nav class="tabs" aria-label="Main app links">
      <a class="tab" href="Roster.html" style="--glow: rgba(56,214,255,.20)">
        <div class="meta">
          <span class="number">01</span>
          <span class="icon">📋</span>
        </div>
        <h2>Roster</h2>
      </a>

      <a class="tab" href="IntraopFluidSimulator.html" style="--glow: rgba(255,209,102,.22)">
        <div class="meta">
          <span class="number">02</span>
          <span class="icon">💧</span>
        </div>
        <span class="beta-logo" aria-label="Beta">BETA</span>
        <h2>IntraOp Fluid Simulator</h2>
      </a>

      <a class="tab" href="asra.html" style="--glow: rgba(255,122,182,.20)">
        <div class="meta">
          <span class="number">03</span>
          <span class="icon">📝</span>
        </div>
        <h2>ASRA 2025 clinical decision maker</h2>
      </a>

      <a class="tab" href="./preop-meds/" style="--glow: rgba(101,245,176,.18)">
        <div class="meta">
          <span class="number">04</span>
          <span class="icon">💊</span>
        </div>
        <h2>Preoperative Medications App</h2>
      </a>

      <a class="tab" href="./ventilation/" style="--glow: rgba(155,140,255,.20)">
        <div class="meta">
          <span class="number">05</span>
          <span class="icon">🫁</span>
        </div>
        <h2>Ventilaor settings</h2>
      </a>
    </nav>
  </main>
</body>
</html>
